services:
  graph:
    image: falkordb/falkordb:v4.14.11
    restart: unless-stopped
    ports:
      - "127.0.0.1:6388:6379"
    volumes:
      - graph-data:/var/lib/falkordb/data
    environment:
      REDIS_ARGS: "--appendonly yes --appendfsync everysec --dir /var/lib/falkordb/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  app:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
    environment:
      HOST: 0.0.0.0
      FALKORDB_HOST: graph
      FALKORDB_PORT: 6379
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1-mini}
    depends_on:
      graph:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4317/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  graph-data:
